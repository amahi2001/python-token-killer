name: Publish

# Trigger: tag a release on GitHub (e.g. v0.1.0)
# PyPI trusted publishing (OIDC) — no tokens or secrets required.
# Setup: https://docs.pypi.org/trusted-publishers/adding-a-publisher/
#   Publisher: amahi2001/python-token-killer
#   Workflow:  publish.yml
#   Environment: pypi
on:
  release:
    types: [published]

permissions: read-all

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      # Build wheel + sdist without uv.sources so the artifacts are
      # compatible with all PEP 517-compliant tools (pypa/build, pip, etc.)
      - name: Build
        run: uv build --no-sources

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      # Required for OIDC trusted publishing — no token needed
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      # uv publish picks up OIDC token automatically in GitHub Actions
      # --check-url skips re-uploading files already on PyPI
      - name: Publish to PyPI
        run: uv publish --check-url https://pypi.org/simple/python-token-killer/
